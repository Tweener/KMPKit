name: Publish to Maven Central

permissions:
  contents: read

on:
  workflow_dispatch:

  release:
    types: [ released ]

jobs:
  build-release:
    name: Build library
    uses: ./.github/workflows/buildRelease.yml

  publish:
    name: Publish library
    needs: build-release

    strategy:
      matrix:
        include:
          - target: publishIosArm64PublicationToMavenCentralRepository
            os: macos-latest
          - target: publishIosSimulatorArm64PublicationToMavenCentralRepository
            os: macos-latest
          - target: publishIosX64PublicationToMavenCentralRepository
            os: macos-latest
          - target: publishAndroidReleasePublicationToMavenCentralRepository
            os: ubuntu-latest
          - target: publishJsPublicationToMavenCentralRepository
            os: ubuntu-latest
          - target: publishWasmJsPublicationToMavenCentralRepository
            os: ubuntu-latest
          - target: publishJvmPublicationToMavenCentralRepository
            os: ubuntu-latest
          - target: publishKotlinMultiplatformPublicationToMavenCentralRepository
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Set up Java JDK ${{ vars.JAVA_JDK_VERSION }}"
        uses: actions/setup-java@v4
        with:
          java-version: '${{ vars.JAVA_JDK_VERSION }}'
          distribution: "zulu"

      - name: Setup Gradle cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.konan
          key: ${{ runner.os }}-${{ hashFiles('**/.lock') }}

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.OSSRH_GPG_SECRET_KEY }}
          passphrase: ${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}

      - name: Publish to Maven Central
        uses: gradle/gradle-build-action@ce999babab2de1c4b649dc15f0ee67e6246c994f
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.OSSRH_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.OSSRH_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.OSSRH_GPG_SECRET_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.OSSRH_GPG_SECRET_KEY }}
        with:
          arguments: |
            ${{ matrix.target }}
            releaseRepository
          retry: 3 # Add retry logic
          timeout: 30m # Increase the timeout

  notify:
    name: Send Slack notification
    needs: publish
    uses: ./.github/workflows/notify.yml
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
